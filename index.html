<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFA L1 Şubat 2027 · Çalışma Planlayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1622; --panel:#141F2E; --panel2:#1A2738; --line:#26374D; --line2:#33465F;
  --text:#E6ECF3; --muted:#8797AB; --up:#3DD68C; --down:#F0665C; --amber:#F5B84B;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
body{min-height:100vh;display:flex;flex-direction:column}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07}
#bg svg{width:100%;height:100%}
#bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.5}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}.amber{color:var(--amber)}
h1{font-size:22px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600;margin:22px 0 8px;color:var(--muted)}
p.hint{color:var(--muted);font-size:13px;margin:8px 0 14px;max-width:70ch}
a{color:inherit}
/* ticker */
#ticker{position:relative;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);overflow:hidden;height:34px;font-family:var(--mono);font-size:12.5px}
#ticker .track{display:inline-flex;white-space:nowrap;animation:tick 70s linear infinite;height:34px;align-items:center}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){#ticker .track{animation:none}}
.tk{display:inline-flex;gap:8px;padding:0 22px;border-right:1px solid var(--line)}
.tk-k{color:var(--muted)}.tk-v{font-weight:600}
/* layout */
#app{position:relative;z-index:1;display:flex;flex:1;min-height:0}
.nav{width:172px;flex:none;border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:2px;background:rgba(14,22,34,.6)}
.nav .brand{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 10px 14px;line-height:1.35}
.nav .brand b{display:block;color:var(--text);font-size:14px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--r);color:var(--muted);font-size:14px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--amber)}
.nav button:focus-visible{outline:2px solid var(--amber)}
#view{flex:1;padding:22px 28px 60px;min-width:0;max-width:1280px}
.grid2{display:grid;grid-template-columns:1.25fr .9fr;gap:26px}
.col{min-width:0}
/* notes, stats */
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);padding:10px 14px;border-radius:var(--r);font-size:14px;margin:0 0 14px}
.note.quiet{border-left-color:var(--line2);color:var(--muted)}
.note.amber{border-left-color:var(--amber)}.note.danger{border-left-color:var(--down)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:21px;font-weight:600;margin-top:2px}
.stat .v input{font-size:16px}
/* rows */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.row.done{opacity:.55}
.rw-main{flex:1;min-width:0}
.rw-t{font-size:14px}.rw-t b{font-family:var(--mono);font-weight:600;margin-right:6px}
.rw-s{font-size:12.5px;color:var(--muted);margin-top:2px}.rw-s em{color:var(--amber);font-style:normal}
.rw-r{font-size:13px;white-space:nowrap}
.chk{position:relative;width:22px;height:22px;flex:none;cursor:pointer}
.chk input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.chk span{position:absolute;inset:0;border:1.5px solid var(--line2);border-radius:4px;background:var(--ink)}
.chk input:checked+span{background:var(--up);border-color:var(--up)}
.chk input:checked+span::after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk input:focus-visible+span{outline:2px solid var(--amber)}
.qmark{flex:none;width:36px;height:22px;border-radius:4px;font-family:var(--mono);font-size:11px;display:grid;place-items:center;font-weight:600}
.qmark.les{background:#2B4C7E;color:#CFE0FF}.qmark.qb{background:#4B3A6B;color:#E1D2FF}
.qlog{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input,select{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line2);border-radius:4px;padding:5px 8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
input.mini{width:72px;padding:4px 6px;font-size:13px}
input.wide{flex:1;min-width:120px}
input[type=date]{color-scheme:dark}
.btn{font:inherit;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:4px;padding:6px 12px}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}.btn:disabled:hover{border-color:var(--line2)}
.btn.danger{border-color:var(--down);color:var(--down)}
.ghost{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:14px}
.ghost:hover{color:var(--text);background:var(--panel2)}.ghost:disabled{opacity:.3;cursor:default}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.extra{margin-top:18px;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.qmark.fr{background:#3F4F2A;color:#DDEBB8}.qmark.vid{background:#2E3A4A;color:#C9D6E6}
.row.next{opacity:.7;border-style:dashed}.row.next:hover{opacity:1}
.nextbox{margin-top:14px;border:1px dashed var(--line2);border-radius:var(--r);padding:8px 10px}
.nextbox summary{cursor:pointer;font-size:13.5px;color:var(--text);list-style:none;padding:2px 0}
.nextbox summary::-webkit-details-marker{display:none}
.nextbox summary::before{content:'▸ ';color:var(--muted)}.nextbox[open] summary::before{content:'▾ '}
.nextbox .rows{margin-top:8px}
.empty.quiet{padding:12px;font-size:13px}
/* log rows */
.loglist{display:flex;flex-direction:column;gap:5px}
.lgr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px;flex-wrap:wrap}
.lgr .lgl{flex:1;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgr .lgl b{font-family:var(--mono);font-weight:600;margin-right:4px}
.lgr .lg-m{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lgr input.mini{width:64px;padding:3px 6px;font-size:12.5px}
.lgr input.wide{flex:1;min-width:140px;padding:3px 8px;font-size:13px}
.lgr input.lg-d{font-size:12px;padding:3px 6px;width:130px}
.logday{margin-bottom:16px}
.logday-h{display:flex;align-items:baseline;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:14px}
.btn.on{border-color:var(--amber);color:var(--amber)}
.pastebox{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.pastebox textarea{font:12px var(--mono);color:var(--text);background:var(--ink);border:1px solid var(--line2);border-radius:4px;padding:8px;width:100%;resize:vertical}
/* curve */
.curve{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 6px;margin-bottom:14px}
.curve-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.leg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin:0 5px 0 10px}
.l-plan{background:var(--muted)}.l-act{background:var(--up)}.l-fc{background:var(--amber)}
.curve svg{width:100%;height:210px;display:block}
.curve .ax{fill:var(--muted);font-size:10px;font-family:var(--mono)}
.curve .gl{stroke:var(--line);stroke-width:1}
.curve .p-plan{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3}
.curve .p-act{fill:none;stroke:var(--up);stroke-width:2.2}
.curve .p-fc{fill:none;stroke:var(--amber);stroke-width:1.5;stroke-dasharray:2 4}
.curve .rv{stroke:var(--amber);stroke-width:1;opacity:.7}
.curve .tl{stroke:var(--text);stroke-width:1;opacity:.5}
/* kayma grafiği */
.curve .p-zero{fill:none;stroke:var(--muted);stroke-width:1.5}
.curve .p-late{fill:none;stroke:var(--down);stroke-width:2.2}
.l-late{background:var(--down)}
.curve-f{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.curve-f b{color:var(--text)}
/* kronometre */
.sw{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:0 0 14px}
.sw-l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.sw-dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.sw-t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;letter-spacing:.02em;line-height:1}
.sw-m{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sw-b{margin-left:auto;display:flex;gap:6px}
.sw.on{border-color:var(--up)}.sw.on .sw-t{color:var(--up)}.sw.on .sw-dot{background:var(--up);animation:swp 1.2s ease-in-out infinite}
.sw.paused .sw-t{color:var(--amber)}.sw.paused .sw-dot{background:var(--amber)}
@keyframes swp{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sw.on .sw-dot{animation:none}}
/* toplam plan ilerlemesi */
.prog{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}
.prog-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:8px}
.prog-h .mono{color:var(--text);font-size:13px}.prog-h b{font-size:16px}
.prog-bar{display:flex;gap:2px;height:12px}
.prog-seg{position:relative;height:100%;background:var(--ink);border-radius:2px;overflow:hidden;min-width:3px}
.prog-seg i{position:absolute;left:0;top:0;bottom:0;display:block}
.prog-f{font-size:11.5px;color:var(--muted);margin-top:7px;font-family:var(--mono)}
/* MM Q-Bank sekmesi */
.qbcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:var(--r);margin-bottom:10px}
.qbcard summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2fr 1fr 1.4fr 1fr 1fr;gap:10px;align-items:center;padding:12px 14px;font-size:13.5px}
.qbcard summary::-webkit-details-marker{display:none}
.qbrow{display:grid;grid-template-columns:44px 2.2fr 80px 1.3fr 64px auto 110px;gap:10px;align-items:center;padding:7px 14px;font-size:13px;border-top:1px solid var(--line)}
.qbrow.skip{opacity:.45}
.qbrow.cur{background:rgba(245,184,75,.06)}
.qbrow .qlog{flex-wrap:nowrap}
.qbrow .pbar{display:block;margin-top:4px;max-width:160px}
.qbquick{background:var(--panel);border:1px solid var(--amber);border-radius:var(--r);margin-bottom:16px;--tc:var(--amber)}
.qbquick .qb-h{padding:10px 14px 4px;font-size:13px;color:var(--muted)}
.st-cur{color:var(--amber)}.st-done{color:var(--up)}
/* week */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar h1{margin:0}.bar .right{margin-left:auto}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wday{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:160px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.wday:hover{border-color:var(--line2)}
.wday.today{border-color:var(--amber)}
.wday.k-rest,.wday.k-blackout,.wday.k-skip{background:transparent;border-style:dashed}
.wday.k-blackout{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(240,102,92,.08) 6px 8px)}
.wd-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.wd-h b{color:var(--text);font-size:14px}
.wd-f{margin-top:auto;font-size:12px;color:var(--up)}
.wg{border-left:3px solid;padding:4px 8px;background:var(--ink);border-radius:0 4px 4px 0;font-size:12px}
.wg-t{font-family:var(--mono);font-weight:600}.wg-n{color:var(--muted);font-size:11.5px;margin:1px 0 3px}.wg-l{font-size:11.5px}
.wg.amber-l{border-left-color:var(--amber)}
/* calendar */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-bottom:14px}
.lg-i i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.sw-bo{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--down) 3px 4px)}.sw-rest{border:1px dashed var(--line2)}.sw-rev{border:1px solid var(--amber)}.sw-miss{background:rgba(240,102,92,.35)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.month{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.mh{font-weight:600;margin-bottom:6px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd{position:relative;aspect-ratio:1;border-radius:4px;font-family:var(--mono);font-size:12px;border:1px solid transparent;cursor:pointer;background:var(--ink)}
.cd.hd{aspect-ratio:auto;padding:2px 0;text-align:center;color:var(--muted);font-size:11px;background:none;cursor:default}
.cd.empty{background:none;cursor:default}
.cd .n{position:absolute;top:3px;left:5px}
.cd .mk{position:absolute;right:4px;top:2px;color:var(--amber);font-weight:700}
.cd .lg{position:absolute;right:4px;bottom:2px;color:var(--up);font-size:10px}
.cd.k-rest{opacity:.45;border-style:dashed;border-color:var(--line)}
.cd.k-blackout{background:repeating-linear-gradient(135deg,var(--ink) 0 5px,rgba(240,102,92,.18) 5px 7px)!important}
.cd.k-skip{background:rgba(240,102,92,.15)!important}
.cd.k-extra{border-color:var(--up)}
.cd.k-out{opacity:.2;cursor:default}
.cd.k-exam{background:var(--amber)!important;color:var(--ink);font-weight:700}
.cd.rev{border-color:var(--amber)}
.cd.today{box-shadow:0 0 0 2px var(--text)}
.cd.missed{background:rgba(240,102,92,.35)!important}
.cd:hover:not(.hd):not(.empty){border-color:var(--text)}
/* topics */
.tcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:var(--r);margin-bottom:10px}
.tcard summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2fr 1fr 1.1fr 1fr 1.2fr 1fr;gap:10px;align-items:center;padding:12px 14px;font-size:13.5px}
.tcard summary::-webkit-details-marker{display:none}
.tc-name{font-weight:600;font-size:15px}
.pbar{height:6px;background:var(--ink);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--tc)}
.lmhead,.lmrow{display:grid;grid-template-columns:44px 2.2fr .6fr .9fr 1.1fr 1fr 70px;gap:10px;align-items:center;padding:7px 14px;font-size:13px;border-top:1px solid var(--line)}
.lmhead{color:var(--muted);font-size:11.5px}
.lmn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* review */
.mockrow,.borow,.orow{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.mockrow input[type=text]{width:150px}
.orow{border-left:3px solid;padding-left:10px;margin-bottom:4px;background:var(--panel);border-radius:0 4px 4px 0}
.orow span:nth-child(2){flex:1}
.weak{display:flex;flex-direction:column;gap:4px}
.wk-i{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px;display:flex;gap:8px}
.wk-i b{font-family:var(--mono)}.wk-i .mono{margin-left:auto}
.rvlist{display:flex;flex-direction:column;gap:4px}
.rvrow{display:grid;grid-template-columns:100px 64px 1fr 220px 80px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px}
.rvrow.today{border-color:var(--amber)}
.rvrow input{font-size:12px;padding:3px 6px}
/* settings */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form label.inline{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;grid-column:1/-1}
.form label.inline input{width:80px}
.form label input,.form label select{color:var(--text)}
.form label.chip-l{flex-direction:row;align-items:center;grid-column:1/-1;color:var(--text)}
.form-l{font-size:13px;color:var(--muted);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;color:var(--text)}
.bolist{display:flex;flex-direction:column}
/* responsive */
@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  #app{flex-direction:column}
  .nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;position:sticky;top:0;z-index:3;background:var(--ink)}
  .nav .brand{display:none}
  .nav button{white-space:nowrap;padding:8px 12px;font-size:13px}
  #view{padding:14px 12px 60px}
  .week{grid-template-columns:1fr}
  .wday{min-height:auto}
  .tcard summary{grid-template-columns:1fr 1fr;font-size:12.5px}
  .lmhead{display:none}
  .lmrow{grid-template-columns:44px 1fr;gap:4px 8px}
  .rvrow{grid-template-columns:1fr 1fr;}
  .form{grid-template-columns:1fr}
  .row{flex-wrap:wrap;gap:8px}
  .rw-main{flex:1 1 60%;min-width:0}
  .qlog{flex-basis:100%}
  .rw-r{margin-left:auto}
  .stat .v{font-size:18px}
  .rvrow{grid-template-columns:1fr 1fr}
  .rvrow span:nth-child(3){grid-column:1/-1}
  .rvrow input{grid-column:1/-1}
  .lgr .lgl{flex:1 1 calc(100% - 60px);white-space:normal}
  .lgr input.lg-d{order:9;flex-basis:100%;width:auto}
  .bar .chips{flex-basis:100%}
  .sw-t{font-size:22px}
  .sw-b{margin-left:0;flex-basis:100%}
  .qbcard summary{grid-template-columns:1fr 1fr;font-size:12.5px}
  .qbrow{grid-template-columns:auto 1fr auto;grid-template-areas:"tag name name" "st cnt min" "log log skip";gap:6px 8px}
  .qbrow .q-tag{grid-area:tag}.qbrow .q-name{grid-area:name}.qbrow .q-st{grid-area:st}.qbrow .q-cnt{grid-area:cnt}.qbrow .q-min{grid-area:min}.qbrow .q-log{grid-area:log}.qbrow .q-skip{grid-area:skip;justify-self:end}
  .qbrow .q-name{white-space:normal}
  .qb-stats{grid-template-columns:1fr 1fr!important}
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="ticker" aria-hidden="true"><div class="track"></div></div>
<div id="app">
  <nav class="nav" aria-label="Bölümler">
    <div class="brand"><b>CFA Level I</b>Şubat 2027<br>Mark Meldrum + CFAI LES</div>
    <button data-v="today">Bugün</button>
    <button data-v="week">Hafta</button>
    <button data-v="calendar">Takvim</button>
    <button data-v="topics">Konular</button>
    <button data-v="qbank">MM Q-Bank</button>

function migrate(o){
  // v1: dayLog[date]={extra,note} (günde tek kayıt) -> free[] (günde çok kayıt)
  if(o.dayLog){
    o.free=Array.isArray(o.free)?o.free:[];
    for(const d of Object.keys(o.dayLog).sort()){ const e=o.dayLog[d]||{}; const m=Number(e.extra)||0, note=String(e.note||'').trim(); if(m>0||note) o.free.push({id:uid(),d,m,note}); }
    delete o.dayLog;
  }
  if(!Array.isArray(o.free)) o.free=[];
  for(const e of o.free){ if(!e.id) e.id=uid(); if(e.m===undefined||e.m===null||e.m==='') e.m=0; else e.m=Number(e.m)||0; }
  // v1: log kayıtlarında id yoktu -> düzenleme/silme için id ekle
  for(const id in (o.items||{})){ const it=o.items[id]; if(!it||!Array.isArray(it.log)) continue; for(const e of it.log) if(!e.id) e.id=uid(); }
  // v3: MM Q-Bank opsiyonel — "çözmeyeceğim" işaretleri
  if(!o.qbSkip||typeof o.qbSkip!=='object') o.qbSkip={};
  return o;
}
function mergeDefaults(obj){ const d=DEFAULTS(); const out={...d,...obj}; out.settings={...d.settings,...(obj.settings||{})}; return migrate(out); }
let S = load();
 
// ===================== TAKVİM KAPASİTESİ =====================
function isBlackout(date){ return S.settings.blackouts.some(b => date>=b.from && date<=b.to); }
function baseCapacity(date){
  const s=S.settings;
  if(date < s.startDate || date >= s.examDate) return 0;
  if(isBlackout(date)) return 0;
  if(s.restDays.includes(parseD(date).getDay())) return 0;
  return s.dailyHours*60;
}
function capacity(date){ const o=S.overrides[date]; if(o!==undefined && o!==null && o!=='') return Number(o)*60; return baseCapacity(date); }
function dayKind(date){
  const s=S.settings;
  if(date===s.examDate) return 'exam';
  if(date < s.startDate || date > s.examDate) return 'out';
  const o=S.overrides[date];
  if(o!==undefined && o!==null && o!=='') return Number(o)>0 ? (baseCapacity(date)>0?'work':'extra') : 'skip';
  if(isBlackout(date)) return 'blackout';
  if(s.restDays.includes(parseD(date).getDay())) return 'rest';
  return 'work';
}
function sumCapacity(from,to){ let t=0; for(let d=from; d<=to; d=addDays(d,1)) t+=capacity(d); return t; }
 
// ===================== İŞ KALEMLERİ =====================
function itemLog(id){ return (S.items[id]&&S.items[id].log)||[]; }
function doneCount(id){ return itemLog(id).reduce((a,e)=>a+(e.c||0),0); }
function actualMin(id){ return itemLog(id).reduce((a,e)=>a+(e.m||0),0); }
function topicByCode(c){ return TOPICS.find(t=>t.code===c); }
 
// MM Q-Bank artık tamamen opsiyonel: kuyruğa, günlük plana, ilerlemeye ve saat hesaplarına girmez.
// Bu tarihten ÖNCE kaydedilen QB süreleri o dönem planın parçasıydı; geçmiş sapma/kayma hesabında kalır.
const QB_OFF_FROM = '2026-09-28';
const isQbId = id => /-qb$/.test(id);
const countsInPlan = (id, date) => !(isQbId(id) && date >= QB_OFF_FROM);
 
// Plan kuyruğu: video + CFAI LES (+ açıksa prereq videoları). Q-Bank yok.
function buildRaw(){
  const s=S.settings, out=[];
  for(const code of s.order){
    const t=topicByCode(code); if(!t) continue;
    if(s.prereq && t.prereq){
      t.prereq.forEach((p,i)=>{
        out.push({id:`${code}-pre${i+1}-v`,topic:code,lm:0,lmName:'Prereq',type:'video',tier:4,label:`Prereq ${i+1} – ${p[0]}`,sec:toS(p[1]),est:toS(p[1])/60*s.videoFactor});
      });
    }
    for(const lm of t.lms){
      const [n,name,w,pg,vids,les,pp]=lm;
      vids.forEach((v,i)=>out.push({id:`${code}-${n}-v${i+1}`,topic:code,lm:n,lmName:name,type:'video',tier:1,label:v[0],sec:toS(v[1]),est:toS(v[1])/60*s.videoFactor}));
      if(les>0) out.push({id:`${code}-${n}-les`,topic:code,lm:n,lmName:name,type:'q',src:'les',tier:2,label:'CFAI LES soruları',count:les,pp,target:les});
    }
  }
  return out;
}
// MM Q-Bank listesi (plan dışı, yalnızca MM Q-Bank sekmesi ve kayıtlar için)
function qbList(){
  const s=S.settings, out=[];
  for(const code of s.order){
    const t=topicByCode(code); if(!t) continue;
    if(s.prereq && t.prereq) t.prereq.forEach((p,i)=>{ if(p[2]>0) out.push({id:`${code}-pre${i+1}-qb`,topic:code,lm:0,pre:i+1,lmName:p[0],type:'q',src:'qb',tier:3,label:'MM Q-Bank',count:p[2],target:p[2]}); });
    for(const lm of t.lms){ const n=lm[0], qb=lm[7]; if(qb>0) out.push({id:`${code}-${n}-qb`,topic:code,lm:n,lmName:lm[1],type:'q',src:'qb',tier:3,label:'MM Q-Bank',count:qb,target:qb}); }
  }
  return out;
}
function remainingMin(it){
  if(it.type==='video') return doneCount(it.id)>0 ? 0 : it.est;
  return Math.max(0, it.target-doneCount(it.id))*S.settings.minPerQ;
}
 
// ===================== PROJEKSİYON =====================
// Kuyruğu 'from' tarihinden itibaren kapasiteye döker
function project(from){
  const s=S.settings;
  const items=buildRaw();
  const dayPlan={}, itemDays={};
  let date=from, capLeft=capacity(date), lastDate=null, overflowMin=0;
  const end=s.examDate;
  for(const it of items){
    let rem = remainingMin(it);
    if(rem<=0.01) continue;
    while(rem>0.01){
      while(capLeft<=0.01){ date=addDays(date,1); if(date>=end) break; capLeft=capacity(date); }
      if(date>=end){ overflowMin+=rem; itemDays[it.id]=itemDays[it.id]||[]; itemDays[it.id].push({date:null,min:rem}); rem=0; break; }
      const a=Math.min(rem,capLeft);
      (dayPlan[date]=dayPlan[date]||[]).push({id:it.id,min:a,part:a<rem||(itemDays[it.id]&&itemDays[it.id].length)});
      (itemDays[it.id]=itemDays[it.id]||[]).push({date,min:a});
      rem-=a; capLeft-=a; lastDate=date;
    }
  }
  return {items, dayPlan, itemDays, learningEnd:lastDate, overflowMin};
}
function planFrom(){ const t=todayIso(); return t<S.settings.startDate ? S.settings.startDate : t; }
 
// Günlük gerçekleşen
function freeMin(date){ let m=0; for(const e of S.free) if(e.d===date) m+=Number(e.m)||0; return m; }
function loggedMin(date){
  let m=0;
  for(const id in S.items) for(const e of (S.items[id].log||[])) if(e.d===date && countsInPlan(id,e.d)) m+=e.m||0;
  return m+freeMin(date);
}
// 'date' dahil o güne kadar biriken gerçek çalışma
function actualUpTo(date){
  let m=0;
  for(const id in S.items) for(const e of (S.items[id].log||[])) if(e.d<=date && countsInPlan(id,e.d)) m+=e.m||0;
  for(const e of S.free) if(e.d<=date) m+=Number(e.m)||0;
  return m;
}
// Plan içeriği (video + LES) — tahmini dakika bazında ilerleme
function totals(items){
  let est=0, done=0, vidT=0, vidD=0, lesT=0, lesD=0;
  for(const it of items){
    if(it.type==='video'){ vidT++; if(doneCount(it.id)>0){vidD++; done+=it.est;} est+=it.est; }
    else { const d=doneCount(it.id); est+=it.target*S.settings.minPerQ; done+=Math.min(d,it.target)*S.settings.minPerQ;
      if(it.src==='les'){lesT+=it.count; lesD+=Math.min(d,it.count);} }
  }
  return {est,done,vidT,vidD,lesT,lesD};
}
// MM Q-Bank (plan dışı) özet
function qbStats(list){
  let total=0, done=0, min=0;
  for(const it of list){ total+=it.count; done+=doneCount(it.id); min+=actualMin(it.id); }
  return {total,done,min};
}
function actualTotal(){ let m=0; for(const id in S.items) for(const e of (S.items[id].log||[])) if(countsInPlan(id,e.d)) m+=e.m||0; for(const e of S.free) m+=Number(e.m)||0; return m; }
function isSkipOverride(date){ const o=S.overrides[date]; return o!==undefined && o!==null && o!=='' && Number(o)===0 && baseCapacity(date)>0; }
 
// ===================== ANA HESAP =====================
let P=null; // güncel projeksiyon
function recompute(){
  const from=planFrom();
  P=project(from);
  P.from=from;
  P.tot=totals(P.items);
  P.qb=qbList();
  P.qbTot=qbStats(P.qb);
  P.actual=actualTotal();
  const s=S.settings;
  P.capLearn=sumCapacity(s.startDate, addDays(s.reviewStart,-1));
  P.capReview=sumCapacity(s.reviewStart, addDays(s.examDate,-1));
  P.capTotal=P.capLearn+P.capReview;
  P.capUsedByOverflow=0;
  for(const d in P.dayPlan) if(d>=s.reviewStart) for(const e of P.dayPlan[d]) P.capUsedByOverflow+=e.min;
  P.reviewLeft=P.capReview-P.capUsedByOverflow;
  P.daysToExam=diffDays(todayIso(), s.examDate);
  // Sapma "dünkü kapanış" bazında: bugünün kapasitesi henüz plana sayılmaz, bugünün çalışması da sapmaya girmez
  const t=todayIso(), y=addDays(t,-1);
  P.plannedToDate = sumCapacity(s.startDate, y);   // y < startDate ise 0
  P.actualToDate = actualUpTo(y);
  P.variance = P.actualToDate - P.plannedToDate;
  P.todayMin = loggedMin(t); P.todayCap = capacity(t);
  // atlanan günler (override 0 olan normal çalışma günleri)
  P.skipped={n:0,min:0};
  for(let d=s.startDate; d<s.examDate; d=addDays(d,1)) if(isSkipOverride(d)){ P.skipped.n++; P.skipped.min+=baseCapacity(d); }
  P.sl=computeSlip();
}

// Kuyrukta sırada bekleyen (bugüne planlanmamış) ilk n öğe
function queueNext(excludeIds, n){
  const out=[];
  for(const it of P.items){ if(excludeIds.has(it.id)) continue; if(remainingMin(it)<=0.01) continue; out.push(it); if(out.length>=n) break; }
  return out;
}
 
// ---------- KAYIT SATIRLARI (Bugün paneli + Kayıtlar sekmesi ortak) ----------
function findLog(itemId, eid){ const it=S.items[itemId]; return it&&it.log ? it.log.find(e=>e.id===eid) : null; }
function findFree(eid){ return S.free.find(e=>e.id===eid); }
function allById(){ const byId={}; P.items.forEach(i=>byId[i.id]=i); P.qb.forEach(i=>byId[i.id]=i); return byId; }
function dayEntries(date){
  const byId=allById();
  const out=[];
  for(const id in S.items) for(const e of (S.items[id].log||[])) if(e.d===date) out.push({kind:'item',id,item:byId[id]||null,e});
  for(const e of S.free) if(e.d===date) out.push({kind:'free',e});
  out.sort((a,b)=>(a.e.ts||0)-(b.e.ts||0));
  return out;
}

// ---------- KAYMA GRAFİĞİ ----------
// Plan referansı = baseCapacity (günlük saat × çalışma günleri; blackout ve dinlenme hariç). Gün bazlı override'lar
// ("bugünü atla", ek gün) plana DAHİL DEĞİL: onlar plandan sapmadır ve bu grafikte kayma olarak görünür.
// kayma (çalışma günü) = (plana göre birikmesi gereken − gerçek birikim) / günlük kapasite   (+ geride, − ileride)
const SLIP_WINDOW = 14; // "bu tempoyla" projeksiyonu son N günün temposunu kullanır
function computeSlip(){
  const s=S.settings, t=todayIso(), start=s.startDate, dayMin=s.dailyHours*60;
  const lend=addDays(s.reviewStart,-1); // öğrenme fazının planlanan son günü (referans bitiş)
  if(!dayMin || t<start) return null;
  const n=diffDays(start,lend); if(n<=0) return null;
  // geçmiş: her gün için kayma
  let planCum=0, actCum=0; const pts=[];
  for(let i=0;i<=n;i++){ const d=addDays(start,i); if(d>t) break; planCum+=baseCapacity(d); actCum+=loggedMin(d); pts.push([i,(planCum-actCum)/dayMin]); }
  if(!pts.length) return null;
  const ti=pts[pts.length-1][0], slipNow=pts[pts.length-1][1];
  // tempo = gerçek / plan, son SLIP_WINDOW günde (en az 1 çalışma günü planı yoksa baştan beri)
  const paceOver=(from)=>{ let p=0,a=0; for(let d=from; d<=t; d=addDays(d,1)){ p+=baseCapacity(d); a+=loggedMin(d); } return [p,a]; };
  let [wp,wa]=paceOver(addDays(t,-(SLIP_WINDOW-1))>start?addDays(t,-(SLIP_WINDOW-1)):start);
  if(wp<dayMin) [wp,wa]=paceOver(start);
  const pace = wp>0 ? clamp(wa/wp, 0.1, 3) : 1;
  // kalan plan (yarın → öğrenme sonu) bu tempoyla ne kadar uzar
  let remPlan=0; for(let d=addDays(t,1); d<=lend; d=addDays(d,1)) remPlan+=baseCapacity(d);
  const slipEnd = slipNow + (remPlan/dayMin)*(1/pace-1);
  // çalışma günü cinsinden kaymayı takvim tarihine çevir (sınav sonrası için dinlenme günleri hariç her gün sayılır)
  const isWork=d=> d<s.examDate ? baseCapacity(d)>0 : !s.restDays.includes(parseD(d).getDay());
  const shift=(from,days)=>{ let d=from, k=0, guard=0; const step=days>=0?1:-1, target=Math.round(Math.abs(days)); while(k<target && guard++<800){ d=addDays(d,step); if(isWork(d)) k++; } return d; };
  const finPace=shift(lend,slipEnd), finPlan=shift(lend,slipNow);
  return {n, lend, pts, ti, slipNow, pace, wp, wa, slipEnd, finPace, finPlan};
}
// Kayma grafiğinin özetini panel olarak gösterir (eskiden grafiğin altındaki satırdı)
function slipStatsHtml(){
  const L=P.sl; if(!L) return '';
  const st=(k,v,cls,sub)=>`<div class="stat"><div class="k">${k}</div><div class="v mono ${cls}">${v}</div><div class="k">${sub}</div></div>`;
  return st('Kayma · bugün', `${fmtSigned(L.slipNow)} gün`, L.slipNow>0.05?'down':'up',
            `${L.slipNow>0.05?'geride':L.slipNow<-0.05?'ileride':'plan üstünde'} · referans ${fmtDate(L.lend)}`)
       + st(`Tempo · son ${SLIP_WINDOW} gün`, `%${Math.round(L.pace*100)}`, L.pace>=1?'up':'down',
            `${fmtH(L.wa)} / plan ${fmtH(L.wp)}`)
       + st('Bu tempoyla bitiş', fmtDate(L.finPace), L.slipEnd>0.05?'down':'up', `${fmtSigned(L.slipEnd)} gün`)
       + st('Plan temposuna dönersen', fmtDate(L.finPlan), L.slipNow>0.05?'down':'up', `${fmtSigned(L.slipNow)} gün`);
}

function renderSlip(){
  const L=P.sl; if(!L) return '';
  const {n, lend, pts, ti, slipNow, slipEnd}=L;
  // çizim
  const W=640,H=170,Lm=44,B=24,T=10,R=10;
  // y aralığı geçmişe göre ölçeklenir; projeksiyon aşırıysa üst/alt kenarda kırpılır (sayı altta yazar)
  const pv=pts.map(p=>p[1]); const pmin=Math.min(...pv), pmax=Math.max(...pv);
  const hi=Math.ceil(Math.max(3, pmax+1, Math.min(slipEnd, pmax+8)));
  const lo=Math.floor(Math.min(-3, pmin-1, Math.max(slipEnd, pmin-8)));
  const clipped = slipEnd>hi || slipEnd<lo;
  const x=i=>Lm+(W-Lm-R)*i/n, y=v=>T+(H-T-B)*(hi-clamp(v,lo,hi))/(hi-lo);
  const stepT=[1,2,5,10,20,30][[1,2,5,10,20,30].findIndex(st=>(hi-lo)/st<=6)] || 30;
  let grid=''; for(let v=Math.ceil(lo/stepT)*stepT; v<=hi; v+=stepT) grid+=`<text x="${Lm-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v>0?'+':''}${v}</text><line x1="${Lm}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/>`;
  const start=S.settings.startDate;
  const months=[]; for(let i=0;i<=n;i++){ const d=parseD(addDays(start,i)); if(d.getDate()===1||i===0) months.push(`<text x="${x(i)}" y="${H-6}" class="ax">${MONTHS_TR[d.getMonth()].slice(0,3)}</text>`); }
  const path=pts.map(([i,v],k)=>`${k?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const fpath=`M${x(ti).toFixed(1)},${y(slipNow).toFixed(1)} L${x(n).toFixed(1)},${y(slipEnd).toFixed(1)}`;
  const cls=slipNow>0?'p-late':'p-act', lcls=slipNow>0?'l-late':'l-act';
  return `<div class="curve"><div class="curve-h"><span>Plana göre kayma <span class="dim">· referans ${fmtDate(lend)}</span></span><span class="leg"><i class="l-plan"></i>plan <i class="${lcls}"></i>gerçek <i class="l-fc"></i>bu tempoyla</span></div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${months.join('')}
   <line x1="${Lm}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" class="p-zero"/><text x="${W-R-2}" y="${y(0)-4}" class="ax" text-anchor="end">plan</text>
   <path d="${fpath}" class="p-fc"/>${clipped?`<text x="${W-R-2}" y="${slipEnd>hi?T+22:H-B-14}" class="ax amber" text-anchor="end">${slipEnd>hi?'↑':'↓'} ${fmtSigned(slipEnd)}</text>`:''}
   <path d="${path}" class="${cls}"/>
   <line x1="${x(ti)}" x2="${x(ti)}" y1="${T}" y2="${H-B}" class="tl"/>
  </svg></div>`;
}

    <button class="ghost q-skip" data-act="qb-skip" data-id="${it.id}" title="${skip?'Bu LM’nin MM sorularını yeniden listeye al':'Bu LM’nin MM sorularını çözmeyeceğim: kalan sayısından düş'}">${skip?'geri al':'çözmeyeceğim'}</button></div>`;
}
function renderQbank(el){
  const s=S.settings, curKey=currentLmKey(), list=P.qb, tot=P.qbTot;
  const curTopic=curKey?curKey.split('-')[0]:s.order[0];
  if(!qbOpen) qbOpen=new Set([curTopic]);
  // özet grupları
  const g={work:{q:0,lm:0,d:0}, next:{q:0,lm:0}, skip:{q:0,lm:0}};
  for(const it of list){
    const left=Math.max(0,it.count-doneCount(it.id)), st=qbStatus(it,curKey);
    if(S.qbSkip[it.id]){ g.skip.q+=left; g.skip.lm++; }
    else if(st==='next'){ g.next.q+=left; g.next.lm++; }
    else { g.work.q+=left; g.work.lm++; g.work.d+=doneCount(it.id); }
  }
  const st=(k,v,sub,cls='')=>`<div class="stat"><div class="k">${k}</div><div class="v mono ${cls}">${v}</div><div class="k">${sub}</div></div>`;
  // hızlı kayıt: şu an çalışılan LM + bir önceki
  const keys=s.order.flatMap(c=>TOPIC_BY[c].lms.map(l=>`${c}-${l[0]}`));
  const ci=curKey?keys.indexOf(curKey):-1;
  const quickKeys = ci>=0 ? [keys[ci-1], keys[ci]].filter(Boolean) : [];
  const quick=quickKeys.map(k=>list.find(it=>`${it.topic}-${it.lm}`===k)).filter(Boolean);
  const quickHtml = quick.length ? `<div class="qbquick"><div class="qb-h">Güncel LM'ler <span class="dim">· şu an çalıştığın ve bir önceki LM, hızlı kayıt</span></div>${quick.map(it=>qbRowHtml(it,'quick',curKey)).join('')}</div>` : '';
  const cards=s.order.map(code=>{
    const t=TOPIC_BY[code], its=list.filter(i=>i.topic===code); if(!its.length) return '';
    const ts=qbStats(its); const left=its.filter(i=>!S.qbSkip[i.id]).reduce((a,i)=>a+Math.max(0,i.count-doneCount(i.id)),0);
    const pct=ts.total?ts.done/ts.total*100:0;
    return `<details class="qbcard" data-code="${code}" style="--tc:${t.color}" ${qbOpen.has(code)?'open':''}><summary><span class="tc-name">${esc(t.name)}</span><span class="mono">${ts.done}/${ts.total}</span><span class="pbar"><i style="width:${pct.toFixed(1)}%"></i></span><span class="mono dim">kalan ${left}</span><span class="mono dim">${ts.min?fmtH(ts.min):'—'}</span></summary>${its.map(it=>qbRowHtml(it,'list',curKey)).join('')}</details>`;
  }).join('');
  el.innerHTML=`<div class="bar"><h1>MM Q-Bank</h1><span class="dim">Opsiyonel · günlük plana, kuyruğa, ilerlemeye ve sapma/kayma hesabına girmez</span></div>
  <div class="stat-grid qb-stats" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
    ${st('Çözülen', `${tot.done} <span class="dim">/ ${tot.total}</span>`, `%${fmtPct((tot.total?tot.done/tot.total*100:0).toFixed(1))} · ${fmtH(tot.min)} harcandı`)}
    ${st("Çalıştığın LM'lerde kalan", `${g.work.q} soru`, `${g.work.lm} LM · ${g.work.d} çözüldü`)}
    ${st("İlerideki LM'lerde", `${g.next.q} soru`, `${g.next.lm} LM`)}
    ${st('Çözmeyeceğim', `${g.skip.q} soru`, `${g.skip.lm} LM işaretli`, 'dim')}
  </div>
  ${quickHtml}
  <p class="hint">Soru sayısını ve süreyi girip Kaydet'e bas (süre boşsa soru × ${fmtPct(s.minPerQ)} dk yazılır). “Çözmeyeceğim” o LM'yi kalan sayısından düşer, geri alınabilir. ${fmtDate(QB_OFF_FROM)} öncesi QB süreleri o dönem planın parçası olduğu için geçmiş sapma hesabında kalır; bundan sonrası plan dışıdır. Yanlış kaydı Kayıtlar → MM Q-Bank filtresinden düzelt.</p>
  ${cards}`;
}

function renderReview(el){
  const s=S.settings; const t=todayIso();

  const workDays=revDays.filter(d=>capacity(d)>0);
  const mockMin=S.mocks.length*(270+180);
  // zayıf LM
  const weak=[]; for(const code of s.order){ const tt=TOPIC_BY[code]; for(const lm of tt.lms){ const a=S.acc[`${code}-${lm[0]}`]; if(a!==undefined&&a!==''){ const ew=s.examW[code]||8; weak.push({code,lm:lm[0],name:lm[1],acc:Number(a),score:ew*(100-Number(a))}); } } }
  weak.sort((a,b)=>b.score-a.score);
  const mocks=S.mocks.slice().sort((a,b)=>a.date<b.date?-1:1).map(m=>`<div class="mockrow"><input type="text" value="${esc(m.name)}" data-mock="${m.id}" data-f="name"><input type="date" value="${m.date}" data-mock="${m.id}" data-f="date" class="mono"><input class="mini mono" type="number" min="0" max="90" placeholder="S1" value="${m.s1}" data-mock="${m.id}" data-f="s1"><input class="mini mono" type="number" min="0" max="90" placeholder="S2" value="${m.s2}" data-mock="${m.id}" data-f="s2"><span class="mono ${m.s1!==''&&m.s2!==''?((Number(m.s1)+Number(m.s2))/180>=0.7?'up':'down'):'dim'}">${m.s1!==''&&m.s2!==''?`%${Math.round((Number(m.s1)+Number(m.s2))/1.8)}`:'—'}</span><span class="dim">${dayKind(m.date)==='blackout'||dayKind(m.date)==='rest'?'⚠ o gün kapasite 0':''}</span><button class="ghost" data-act="mock-del" data-id="${m.id}">✕</button></div>`).join('');
  // günlük review planı (basit döngü)
  const plan=revDays.map(d=>{
    const cap=capacity(d); const mock=S.mocks.find(m=>m.date===d); const over=(P.dayPlan[d]||[]).reduce((a,e)=>a+e.min,0);
    let what='';
    if(mock) what=`<b>${esc(mock.name)}</b> — Session 1 + 2 (2×135 dk), akşam yanlışları işaretle`;

    else if(cap===0) what=`<span class="dim">${dayKind(d)==='blackout'?'blackout':'dinlenme'}</span>`;
    else { const prevMock=S.mocks.filter(m=>m.date<d).sort((a,b)=>a.date<b.date?1:-1)[0]; const daysLeft=diffDays(d,s.examDate);
      if(daysLeft<=2) what='Ethics tekrar + formül kağıdı, yeni konu yok, erken yat';
      let analysisDay=null; if(prevMock){ for(let x=addDays(prevMock.date,1); x<s.examDate; x=addDays(x,1)) if(capacity(x)>0){ analysisDay=x; break; } }
      if(prevMock&&analysisDay===d) what=`${esc(prevMock.name)} çözüm analizi: her yanlış için LOS'u bul, LES'te o modülden 10 soru`;
      else what=weak.length?`Zayıf LM'ler: ${weak.slice(0,3).map(w=>`${w.code} LM${w.lm}`).join(', ')} + Ethics okuma`:`Konu tekrarı (Doğruluk girince burada zayıf LM'ler listelenir) + Ethics okuma`; }
    const note=S.reviewNotes[d]||'';
    return `<div class="rvrow ${d===t?'today':''}"><span class="mono">${fmtDateShort(d)}</span><span class="mono dim">${cap?fmtHM(cap):''}</span><span>${what}</span><input type="text" placeholder="kendi notun" value="${esc(note)}" data-rn="${d}"><span class="mono dim">${loggedMin(d)?'✓ '+fmtHM(loggedMin(d)):''}</span></div>`;
  }).join('');
  el.innerHTML=`<div class="bar"><h1>Review ve mock</h1></div>
  <div class="grid2">
    <section class="col">
      <div class="stat-grid">
        <div class="stat"><div class="k">Review başlangıcı</div><div class="v"><input type="date" class="mono" id="rv-start" value="${s.reviewStart}"></div></div>
        <div class="stat"><div class="k">Review çalışma günü</div><div class="v mono">${workDays.length} <span class="dim">/ ${revDays.length} takvim günü</span></div></div>
        <div class="stat"><div class="k">Review kapasitesi</div><div class="v mono">${fmtH(P.capReview)}</div>${P.capUsedByOverflow>0?`<div class="k down">${fmtH(P.capUsedByOverflow)} öğrenme taşmasına gidiyor</div>`:''}</div>
        <div class="stat"><div class="k">Mock'lara giden</div><div class="v mono">${fmtH(mockMin)}</div><div class="k">${S.mocks.length} mock × (4,5 sa sınav + 3 sa analiz)</div></div>
      </div>
      <h2>Mock sınavlar</h2>
      <p class="hint">Mock = tam boy deneme: 2 oturum × 90 soru × 135 dk, gerçek sınavla aynı format. LES'te A, B ve Practice Pack 1–5 var (7 adet). Mock + analizi bir günlük kapasitenin 2,5 katı; mock günü 3 saatle bitmez, ertesi gün analiz gerekir. Skorları /90 olarak gir.</p>
      <div class="mocks">${mocks}</div>
      <button class="btn sm" data-act="mock-add">+ Mock ekle</button>
    </section>
    <aside class="col">
      <h2>Zayıf LM'ler</h2>
      <p class="hint">Konular sekmesinde LES doğruluk yüzdesi girdikçe burada sınav ağırlığı × hata oranına göre sıralanır.</p>
      ${weak.length?`<div class="weak">${weak.slice(0,12).map(w=>`<div class="wk-i"><b style="color:${topicColor(w.code)}">${w.code} LM${w.lm}</b> ${esc(w.name)} <span class="mono ${w.acc<65?'down':''}">%${w.acc}</span></div>`).join('')}</div>`:'<div class="empty">Henüz doğruluk verisi yok.</div>'}
    </aside>
  </div>
  <h2>Günlük review planı</h2>
  <div class="rvlist">${plan}</div>`;
}

// ===================== KRONOMETRE =====================
// Zaman damgası bazlı: sekme değişse, telefon kilitlense ya da sayfa yenilense de doğru sayar.
// Plan verisinden ayrı saklanır (JSON yedeğine girmez).
const SW_KEY='cfa-l1-stopwatch', BASE_TITLE=document.title;
let SW=(()=>{ try{ const o=JSON.parse(localStorage.getItem(SW_KEY)||'null'); if(o&&typeof o.acc==='number') return {acc:o.acc, start:typeof o.start==='number'?o.start:null}; }catch(e){} return {acc:0,start:null}; })();
function swSave(){ try{ localStorage.setItem(SW_KEY, JSON.stringify(SW)); }catch(e){} }
function swMs(){ return Math.max(0, SW.acc + (SW.start ? Date.now()-SW.start : 0)); }
function swClock(ms){ const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60; return `${h}:${pad(m)}:${pad(sec)}`; }
function swState(){ return SW.start ? 'on' : (SW.acc>0 ? 'paused' : ''); }
function swHtml(){
  const st=swState(), ms=swMs();
  const lbl = st==='on' ? 'Durdur' : st==='paused' ? 'Devam et' : 'Başlat';
  return `<div class="sw ${st}" id="sw"><span class="sw-l"><span class="sw-dot"></span>Kronometre</span>
    <span class="sw-t" id="sw-t">${swClock(ms)}</span><span class="sw-m" id="sw-m">≈ ${Math.round(ms/60000)} dk</span>
    <span class="sw-b"><button class="btn sm ${st==='on'?'on':''}" data-act="sw-toggle">${lbl}</button><button class="btn sm" data-act="sw-reset" ${ms>0?'':'disabled'}>Sıfırla</button></span></div>`;
}
function swRedraw(){ const w=$('#sw'); if(w) w.outerHTML=swHtml(); swTick(); } // tam render yok: yazılmış dk alanları silinmesin
function swTick(){
  const ms=swMs(); const el=$('#sw-t'); if(el) el.textContent=swClock(ms);
  const m=$('#sw-m'); if(m) m.textContent=`≈ ${Math.round(ms/60000)} dk`;
  document.title = SW.start ? `⏱ ${swClock(ms)} · CFA` : BASE_TITLE;
}
setInterval(swTick, 1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) swTick(); });
 
// ===================== OLAYLAR =====================
function logDate(){ return todayIso()<S.settings.startDate?S.settings.startDate:todayIso(); }
function addLog(id, c, m){ S.items[id]=S.items[id]||{log:[]}; S.items[id].log.push({id:uid(), d:logDate(), c, m, ts:Date.now()}); }
function applyImport(text){ const obj=JSON.parse(text); if(!obj||typeof obj!=='object'||!obj.settings) throw new Error('Bu bir planlayıcı yedeği değil'); S=mergeDefaults(obj); pasteOpen=false; render(); }
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); const nav=e.target.closest('.nav button');
  if(nav){ view=nav.dataset.v; render(); return; }
  if(e.target.closest('.wday') && !b && view==='week'){ askCapacity(e.target.closest('.wday').dataset.date); return; }
  if(e.target.closest('.cd[data-date]') && view==='calendar'){ askCapacity(e.target.closest('.cd').dataset.date); return; }
  if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='sw-toggle'){ if(SW.start){ SW.acc+=Date.now()-SW.start; SW.start=null; } else SW.start=Date.now(); swSave(); swRedraw(); return; }
  if(a==='sw-reset'){ SW={acc:0,start:null}; swSave(); swRedraw(); return; }
  if(a==='qblog'){ const k=b.dataset.key; const ci=$(`[data-qbc="${k}"]`), mi=$(`[data-qbm="${k}"]`); const c=Number(ci&&ci.value), m=Number(mi&&mi.value); if(!c){ if(ci) ci.focus(); return; } addLog(id,c,m||Math.round(c*S.settings.minPerQ)); render(); return; }
  if(a==='qb-skip'){ if(S.qbSkip[id]) delete S.qbSkip[id]; else S.qbSkip[id]=true; render(); return; }
  if(a==='qlog'){ const c=Number($(`[data-qc="${id}"]`).value), m=Number($(`[data-qm="${id}"]`).value); if(!c){ $(`[data-qc="${id}"]`).focus(); return; } addLog(id,c,m||Math.round(c*S.settings.minPerQ)); render(); }
  else if(a==='free'){ const m=Number($('#free-min').value)||0, note=$('#free-note').value.trim(); if(!m&&!note){ $('#free-min').focus(); return; } S.free.push({id:uid(), d:logDate(), m, note, ts:Date.now()}); render(); }
  else if(a==='le-del'){ const it=S.items[b.dataset.item]; if(it&&it.log&&confirm('Bu kaydı sil? Öğe kuyruğa geri döner.')){ it.log=it.log.filter(e=>e.id!==b.dataset.eid); render(); } }
  else if(a==='fe-del'){ if(confirm('Serbest çalışma kaydını sil?')){ S.free=S.free.filter(e=>e.id!==b.dataset.eid); render(); } }
  else if(a==='logf'){ logFilter=b.dataset.f; render(); }
  else if(a==='skip-today'){ S.overrides[todayIso()]=0; render(); }
  else if(a==='ovr-clear'){ delete S.overrides[b.dataset.date]; render(); }
  else if(a==='ew-reset'){ S.settings.examW={...DEFAULTS().settings.examW}; render(); }
  else if(a==='copy'){ const txt=JSON.stringify(S); const ok=()=>{ b.textContent='Kopyalandı ✓'; setTimeout(()=>{ b.textContent='Panoya kopyala'; },1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>{ prompt('Kopyalanamadı — bu metni kendin kopyala:', txt); });
    else prompt('Bu metni kopyala:', txt); }
  else if(a==='paste'){ const open=()=>{ pasteOpen=true; render(); setTimeout(()=>{ const ta=$('#paste-box'); if(ta) ta.focus(); },0); };
    if(navigator.clipboard&&navigator.clipboard.readText) navigator.clipboard.readText().then(txt=>{ if(!txt||!txt.trim()){ open(); return; } if(confirm('Panodaki yedek yüklenecek ve bu cihazdaki mevcut veri tamamen değişecek. Devam?')) { try{ applyImport(txt); }catch(err){ alert('Pano içeriği okunamadı: '+err.message); open(); } } }).catch(open);
    else open(); }
  else if(a==='paste-apply'){ const txt=($('#paste-box')||{}).value||''; if(!txt.trim()) return; if(!confirm('Yapıştırılan yedek yüklenecek ve mevcut veri tamamen değişecek. Devam?')) return; try{ applyImport(txt); }catch(err){ alert('Okunamadı: '+err.message); } }
  else if(a==='paste-close'){ pasteOpen=false; render(); }
  else if(a==='wk'){ const n=Number(b.dataset.n); weekAnchor = n===0 ? weekStart(planFrom()) : addDays(weekAnchor, n*7); render(); }
  else if(a==='mock-add'){ S.mocks.push({id:uid(),name:'CFAI Mock',date:S.settings.reviewStart,s1:'',s2:''}); render(); }
  else if(a==='mock-del'){ S.mocks=S.mocks.filter(m=>m.id!==id); render(); }
  else if(a==='bo-add'){ S.settings.blackouts.push({id:uid(),from:todayIso(),to:todayIso(),label:''}); render(); }
  else if(a==='bo-del'){ S.settings.blackouts=S.settings.blackouts.filter(x=>x.id!==id); render(); }
  else if(a==='ord'){ const o=S.settings.order, i=o.indexOf(b.dataset.c), j=i+Number(b.dataset.n); if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; render(); }
  else if(a==='export'){ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download=`cfa-planner-${todayIso()}.json`; l.click(); URL.revokeObjectURL(u); }
  else if(a==='reset'){ if(confirm('Tüm ilerleme ve ayarlar silinecek. Emin misin?')){ S=DEFAULTS(); render(); } }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.act==='vid'){ const id=t.dataset.id; if(t.checked){ const inp=$(`[data-min="${id}"]`); const it=P.items.find(i=>i.id===id); addLog(id,1,Number(inp&&inp.value)||Math.round(it.est)); } else { if(S.items[id]) S.items[id].log=[]; } render(); }
  else if(t.dataset.s!==undefined){ const k=t.dataset.s; let v=t.type==='checkbox'?t.checked:t.value; if(t.type==='number') v=Number(v); S.settings[k]=v; if(k==='examDate'&&S.settings.reviewStart>=v) S.settings.reviewStart=addDays(v,-20); render(); }
  else if(t.dataset.rest!==undefined){ const d=Number(t.dataset.rest); const r=S.settings.restDays; if(t.checked&&!r.includes(d)) r.push(d); if(!t.checked) S.settings.restDays=r.filter(x=>x!==d); render(); }
  else if(t.dataset.bo){ const b=S.settings.blackouts.find(x=>x.id===t.dataset.bo); b[t.dataset.f]=t.value; if(b.to<b.from) b.to=b.from; render(); }
  else if(t.dataset.mock){ const m=S.mocks.find(x=>x.id===t.dataset.mock); m[t.dataset.f]=t.value; render(); }
  else if(t.dataset.acc!==undefined){ S.acc[t.dataset.acc]=t.value; save(); }
  else if(t.dataset.ew!==undefined){ S.settings.examW[t.dataset.ew]=Number(t.value); render(); }
  else if(t.dataset.rn!==undefined){ S.reviewNotes[t.dataset.rn]=t.value; save(); }
  // kayıt düzenleme (Bugün paneli + Kayıtlar)
  else if(t.dataset.lem!==undefined){ const e=findLog(t.dataset.lem, t.dataset.eid); if(e){ e.m=Math.max(0,Number(t.value)||0); render(); } }
  else if(t.dataset.lec!==undefined){ const e=findLog(t.dataset.lec, t.dataset.eid); if(e){ e.c=Math.max(0,Number(t.value)||0); render(); } }
  else if(t.dataset.led!==undefined){ const e=findLog(t.dataset.led, t.dataset.eid); if(e&&t.value){ e.d=t.value; render(); } }
  else if(t.dataset.fem!==undefined){ const e=findFree(t.dataset.fem); if(e){ e.m=Math.max(0,Number(t.value)||0); render(); } }
  else if(t.dataset.fen!==undefined){ const e=findFree(t.dataset.fen); if(e){ e.note=t.value; save(); } }
  else if(t.dataset.fed!==undefined){ const e=findFree(t.dataset.fed); if(e&&t.value){ e.d=t.value; render(); } }
  else if(t.id==='rv-start'){ S.settings.reviewStart=t.value; render(); }
  else if(t.id==='imp'){ const f=t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ applyImport(r.result); }catch(err){ alert('Dosya okunamadı: '+err.message); } }; r.readAsText(f); t.value=''; }
});
// MM Q-Bank sekmesinde açık konu kartları render sonrası da açık kalsın
document.addEventListener('toggle', e=>{ const d=e.target; if(!d.classList||!d.classList.contains('qbcard')) return; if(d.open) qbOpen.add(d.dataset.code); else qbOpen.delete(d.dataset.code); }, true);
function askCapacity(date){
  const cur=S.overrides[date]; const base=baseCapacity(date)/60;
  const v=prompt(`${fmtDate(date,true)}\nVarsayılan kapasite: ${base} saat${cur!==undefined?` · şu an: ${cur} saat`:''}\n\nYeni kapasite (saat). 0 = o günü atla, boş = varsayılana dön:`, cur!==undefined?cur:'');
  if(v===null) return;
  if(v.trim()==='') delete S.overrides[date]; else S.overrides[date]=Number(v);
  render();
}
// ===================== ARKA PLAN MUM GRAFİĞİ =====================
function bgCandles(){
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  let p=50, out=''; const n=90, w=1600/n;
  for(let i=0;i<n;i++){ const o=p, c=clamp(p+(rnd()-0.48)*8,10,95); const hi=Math.max(o,c)+rnd()*4, lo=Math.min(o,c)-rnd()*4; const x=i*w+w*0.5;
    out+=`<line x1="${x}" x2="${x}" y1="${100-hi}" y2="${100-lo}" stroke="${c>=o?'#3DD68C':'#F0665C'}" stroke-width="0.6"/><rect x="${x-w*0.3}" y="${100-Math.max(o,c)}" width="${w*0.6}" height="${Math.max(0.6,Math.abs(c-o))}" fill="${c>=o?'#3DD68C':'#F0665C'}"/>`; p=c; }
  $('#bg').innerHTML=`<svg viewBox="0 0 1600 100" preserveAspectRatio="none">${out}</svg>`;
}
bgCandles();
render();
